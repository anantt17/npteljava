<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f223f"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base container with sleek rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Coffee steam trails -->
  <g fill="none" stroke="#FAF7F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Left steam -->
    <path d="M 50 37 C 48 33, 53 29, 51 25" />
    <!-- Center steam -->
    <path d="M 60 37 C 57 32, 64 27, 61 22" />
    <!-- Right steam -->
    <path d="M 70 37 C 68 33, 73 29, 71 25" />
  </g>

  <!-- Stylized Serif 'J' with classic typography aesthetic -->
  <path d="
    M 42 41.5
    C 49 41.5, 52 41, 56 41
    H 78
    C 75 42.5, 73 45, 73 47.5
    H 66
    V 72
    C 66 79, 63 83.5, 57.5 86.5
    C 52.5 89.2, 45 88.5, 41.5 84
    C 38 79.5, 39.5 73.5, 44 71.5
    C 48.5 69.5, 53.5 72.5, 53 77
    C 52.6 80, 48.5 81.5, 46.5 80
    C 45.5 79.2, 45.5 78, 46 77
    C 46.8 75.5, 49 76, 49.5 77.8
    C 50.2 80, 46 83, 42.5 81
    C 39 78.5, 39.5 71, 45.5 67
    C 52 62.5, 60 66, 60 74
    V 47.5
    H 50
    C 48 45, 45 42.5, 42 41.5
    Z
  " fill="#FAF7F0" filter="url(#softGlow)" display="none"/>

  <!-- Clean refined Serif J -->
  <g fill="#FAF7F0">
    <!-- Top serif bar -->
    <path d="M 43 42 C 48 42.2, 54 42, 60 42 C 66 42, 72 42.2, 77 42 C 75 43.5, 73.5 45.2, 73 48 H 65 V 72 C 65 77.5, 63 82.5, 59 85.5 C 54.5 89, 47 88.5, 42.5 84 C 38 79.5, 38.5 72.5, 44 69.5 C 48.5 67 53.5 70 53.5 75 C 53.5 79.5, 49 82.5, 45 81 C 42 80, 41 77.5, 42 75.5 C 42.8 74, 44.8 74.2, 45.2 75.5 C 45.8 77.5, 43 78.8, 43 78.8 C 45 81.5, 51.5 82.5, 54.5 79 C 57 76, 57.5 71.5, 57.5 67 V 48 H 47 C 46.5 45.2, 45 43.5, 43 42 Z"/>
    
    <!-- 3 minimal accent dots -->
    <circle cx="48" cy="98" r="2.8"/>
    <circle cx="60" cy="98" r="2.8"/>
    <circle cx="72" cy="98" r="2.8"/>
  </g>
</svg>
